name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_PROJECT_TOOLCHAIN: "1.97.1"
  RUST_PORTABLE_MSRV: "1.85.0"

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jsonschema for pack validation
        run: pip install --break-system-packages jsonschema --quiet
      - run: python3 scripts/validate_pack.py
      - run: python3 scripts/verify_owner_gates.py
      - run: python3 scripts/verify_architecture_map.py
      - run: python3 scripts/verify_pipeline_contracts.py
      - run: python3 scripts/check_action_pins.py

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jsonschema and pytest for the governance and packaging suites
        run: pip install --break-system-packages jsonschema pytest --quiet
      - name: Recovery, Grok-task and DeepSeek-task governance validators
        run: >-
          python3 -m unittest
          tests.governance.test_recovery_validators
          tests.governance.test_run_grok_task
          tests.governance.test_run_deepseek_task
      - name: Packaging candidate and qualification suites
        run: >-
          python3 -m pytest tests/packaging -p no:cacheprovider -q
          --deselect
          tests/packaging/test_build_deb_candidate.py::DisposableDebCandidateTests::test_dpkg_failure_does_not_leave_candidate_or_call_legacy_builder
      - name: P9 failure-injection harnesses in stub mode
        run: python3 -m pytest tests/hardening -p no:cacheprovider -q
      # The two tests below hash artifacts/releases/narrivy_0.2.3_amd64.deb, a
      # gitignored release artifact that a fresh CI checkout does not contain.
      # They stay non-blocking until a qualification host supplies the artifact.
      - name: Legacy release-artifact quarantine tests (requires a real .deb)
        continue-on-error: true
        run: >-
          python3 -m pytest
          tests/governance/test_legacy_deb_builder_quarantine.py
          tests/packaging/test_build_deb_candidate.py::DisposableDebCandidateTests::test_dpkg_failure_does_not_leave_candidate_or_call_legacy_builder
          -p no:cacheprovider -q

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_PROJECT_TOOLCHAIN" --profile minimal --component rustfmt clippy
          rustup override set "$RUST_PROJECT_TOOLCHAIN"
      - name: Install Tauri 2 Linux development dependencies (ADR-0075)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build embedded desktop assets
        run: |
          npm ci --prefix apps/narrivy-desktop
          npm run build --prefix apps/narrivy-desktop
      - name: Test desktop frontend (vitest)
        run: npm test --prefix apps/narrivy-desktop
      - run: python3 scripts/verify-boundaries.py
      - run: python3 scripts/verify_dependency_boundaries.py
      - run: python3 scripts/verify_frontend_boundaries.py
      - run: python3 -m unittest discover -s tests/governance -p 'test_boundary_validators.py'
      - run: python3 -m unittest tests.governance.test_desktop_tauri tests.governance.test_tauri_lockdown
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check process-isolated resident ASR feature
        run: >-
          cargo test -p narrivy-asr-transcribe
          --features resident-worker --locked
      - name: Build the worker with the Vulkan backend (ADR-0076)
        run: |
          sudo apt-get install --yes --no-install-recommends libvulkan-dev glslc spirv-headers
          cargo clippy -p narrivy-asr-transcribe --all-targets --features vulkan --locked -- -D warnings
          cargo build -p narrivy-asr-transcribe --features vulkan --bin narrivy-transcribe-worker --locked
      - name: Build and test the OpenVINO worker (ADR-0078; needs no OpenVINO SDK)
        run: |
          cargo clippy -p narrivy-asr-openvino --all-targets --features worker --locked -- -D warnings
          cargo test -p narrivy-asr-openvino --features worker --locked
      - name: Test daemon resident-ASR composition
        run: >-
          cargo test -p narrivyd
          --features asr-transcribe-resident --locked
      - name: Lint daemon resident-ASR composition
        run: >-
          cargo clippy -p narrivyd --all-targets
          --features asr-transcribe-resident --locked -- -D warnings

  portable-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_PROJECT_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_PROJECT_TOOLCHAIN"
      - name: Check portable crates on native runner
        shell: bash
        run: >-
          cargo check --locked
          -p narrivy-types
          -p narrivy-platform-api
          -p narrivy-asr-api
          -p narrivy-policy
          -p narrivy-pipeline
          -p narrivy-ipc
          -p narrivy-journal-api
          -p narrivy-diagnostics
          -p narrivy-core

  portable-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install portable MSRV
        run: rustup toolchain install "$RUST_PORTABLE_MSRV" --profile minimal
      - name: Check portable crates at MSRV
        run: >-
          cargo +${RUST_PORTABLE_MSRV} check --locked
          -p narrivy-types
          -p narrivy-platform-api
          -p narrivy-asr-api
          -p narrivy-policy
          -p narrivy-pipeline
          -p narrivy-ipc
          -p narrivy-journal-api
          -p narrivy-diagnostics
          -p narrivy-core

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_PROJECT_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_PROJECT_TOOLCHAIN"
      - name: Install cargo-deny (pinned 0.20.2)
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
