[package]
publish = false
name = "narrivy-browser-host"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Native-messaging host that connects Narrivy's browser extension to narrivyd (writing assistant, D26)."
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
narrivy-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true

# Daemon transport (`src/transport.rs`): the Unix socket on Unix, the
# per-user named pipe on Windows (PORT-007).
[target.'cfg(unix)'.dependencies]
narrivy-ipc-unix.workspace = true

[target.'cfg(windows)'.dependencies]
narrivy-ipc-windows.workspace = true
