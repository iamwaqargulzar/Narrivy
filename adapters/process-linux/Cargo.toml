[package]
publish = false
name = "narrivy-process-linux"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Trusted system-helper launching on Linux: identity checks, environment scrubbing and process-group containment."
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
