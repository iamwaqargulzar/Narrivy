[package]
publish = false
name = "narrivy-journal-windows"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Secure Windows filesystem adapter for the recovery journal."
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

# The whole adapter is Windows-only (`#![cfg(windows)]`).
[target.'cfg(windows)'.dependencies]
narrivy-journal-api.workspace = true
serde_json.workspace = true
tempfile.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
narrivy-types.workspace = true
