[workspace]
resolver = "3"
members = [
  "crates/narrivy-types",
  "crates/narrivy-platform-api",
  "crates/narrivy-asr-api",
  "crates/narrivy-policy",
  "crates/narrivy-pipeline",
  "crates/narrivy-ipc",
  "crates/narrivy-journal-api",
  "crates/narrivy-diagnostics",
  "crates/narrivy-compute",
  "crates/narrivy-core",
  "crates/narrivy-model-manager",
  "crates/narrivy-history",
  "engines/asr-mock",
  "engines/transcribe-cpp",
  "engines/openvino",
  "engines/grammar-harper",
  "engines/voice-sherpa",
  "adapters/platform-null",
  "adapters/platform-linux",
  "adapters/platform-windows",
  "adapters/process-linux",
  "adapters/ipc-unix",
  "adapters/ipc-windows",
  "adapters/journal-unix",
  "adapters/journal-windows",
  "adapters/process-windows",
  "services/narrivyd",
  "apps/narrivy-cli",
  "apps/narrivy-browser-host",
  "apps/narrivy-desktop/src-tauri",
]
exclude = ["vendor", "engines/voice-urdu"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/iamwaqargulzar/narrivy"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[workspace.dependencies]
narrivy-types = { path = "crates/narrivy-types" }
narrivy-platform-api = { path = "crates/narrivy-platform-api" }
narrivy-compute = { path = "crates/narrivy-compute" }
narrivy-model-manager = { path = "crates/narrivy-model-manager" }
narrivy-asr-api = { path = "crates/narrivy-asr-api" }
narrivy-policy = { path = "crates/narrivy-policy" }
narrivy-pipeline = { path = "crates/narrivy-pipeline" }
narrivy-ipc = { path = "crates/narrivy-ipc" }
narrivy-ipc-unix = { path = "adapters/ipc-unix" }
narrivy-ipc-windows = { path = "adapters/ipc-windows" }
narrivy-journal-api = { path = "crates/narrivy-journal-api" }
narrivy-journal-unix = { path = "adapters/journal-unix" }
narrivy-journal-windows = { path = "adapters/journal-windows" }
narrivy-diagnostics = { path = "crates/narrivy-diagnostics" }
narrivy-core = { path = "crates/narrivy-core" }
narrivy-history = { path = "crates/narrivy-history" }
narrivy-platform-linux = { path = "adapters/platform-linux" }
narrivy-process-linux = { path = "adapters/process-linux" }
narrivy-process-windows = { path = "adapters/process-windows" }
narrivy-platform-windows = { path = "adapters/platform-windows" }
narrivy-grammar-harper = { path = "engines/grammar-harper" }
narrivy-voice-sherpa = { path = "engines/voice-sherpa" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# narrivy-core uses rusqlite and sha2 and must build at the portable MSRV
# (`rust-version`, CI job `portable-msrv`). rusqlite 0.41 and sha2 0.11 need
# Rust 1.88 or newer.
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tempfile = "3"
# Windows "Ignore this computer's sound": pure-Rust WebRTC audio processing
# (AEC3, noise suppression, AGC2), BSD-3-Clause, pinned exactly.
sonora = { version = "=0.3.0", default-features = false }
# PNG pictures of the screen in Windows meetings (screen_keeper); already
# in the tree through `image`.
png = { version = "0.18.1", default-features = false }
# Property tests at the untrusted-input boundaries (dev-only). No default
# features: no fork/timeout runner, no on-disk regression files.
proptest = { version = "1", default-features = false, features = ["std"] }
ashpd = { version = "=0.12.3", default-features = false, features = ["tokio"] }
tokio = { version = "=1.54.1", features = ["net", "rt", "signal", "time"] }
futures-util = "=0.3.34"
rand = "=0.10.3"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
reis = { version = "=0.7.1", default-features = false }
rustix = { version = "=1.1.5", features = ["event", "fs", "pipe", "process", "time"] }
# The Linux adapter's clipboard access through the Wayland data-control
# protocol (no external clipboard helper). Pure Rust.
wayland-client = { version = "=0.31.15", default-features = false }
wayland-protocols = { version = "=0.32.13", default-features = false, features = ["client", "staging"] }
wayland-protocols-misc = { version = "=0.3.12", default-features = false, features = ["client"] }
# Win32 bindings for the Windows adapters (ipc-windows, journal-windows,
# process-windows); the version is already in the lock file through tokio and
# Tauri. Each adapter adds the features it needs.
windows-sys = { version = "=0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }


# Development builds hash whole model files (hundreds of megabytes) at start
# and on every model change. Unoptimised SHA-256 makes that take most of a
# minute, so the hashing crates are always optimised.
[profile.dev.package.sha2]
opt-level = 3

# The writing checker runs on every pause in typing; unoptimised it takes
# hundreds of milliseconds instead of a few.
[profile.dev.package.harper-core]
opt-level = 3
[profile.dev.package.harper-brill]
opt-level = 3
[profile.dev.package.fst]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3

# transcribe.cpp's native sources with Narrivy's encoder-attention patch
# (vendor/transcribe-cpp-sys/NARRIVY-PATCH.md). The safe wrapper stays the
# published transcribe-cpp =0.4.1.
[patch.crates-io]
transcribe-cpp-sys = { path = "vendor/transcribe-cpp-sys" }
