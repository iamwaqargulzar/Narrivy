[graph]
all-features = true

[advisories]
# Owner risk acceptance D22 / ADR-0075 (2026-09-29): the Tauri 2 desktop host
# on Linux. Each entry is an "unmaintained" notice with no known
# vulnerability, inside Tauri's own GTK3 stack or the GTK3 layer-shell
# overlay that Handy also uses. Nothing else may be added without a new
# owner decision. Re-evaluate at every Tauri release, and drop these when
# Tauri ships GTK4/WebKitGTK 6 on Linux (wry PR #1767).
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via Tauri's GTK3 menu stack (muda -> gtk 0.18 -> glib-macros); ADR-0075" },
  { id = "RUSTSEC-2024-0422", reason = "gtk-layer-shell GTK3 bindings for the Linux overlay (Handy approach); ADR-0075" },
  { id = "RUSTSEC-2024-0423", reason = "gtk-layer-shell-sys GTK3 bindings for the Linux overlay (Handy approach); ADR-0075" },
  # Owner risk acceptance D43 (2026-10-31), report:
  # docs/maintainers/supply-chain/advisories-2026-10.md. None clears from this
  # repository alone. Re-check the harper entries at every harper-core release;
  # the zip entries come out when harper-core needs zip 9, and the acceptance
  # ends if harper-core starts extracting archives to disk. Re-check the zbus
  # entries at every Tauri and ashpd release; move to zbus 6 once both support it.
  { id = "RUSTSEC-2026-0367", reason = "zip 8.6 via harper-core: extraction keeps SUID bits; harper never extracts to disk, D43" },
  { id = "RUSTSEC-2026-0368", reason = "zip 8.6 via harper-core: extraction symlink targets; harper never extracts to disk, D43" },
  { id = "RUSTSEC-2026-0369", reason = "zip 8.6 via harper-core: extraction permissions through symlinks; harper never extracts to disk, D43" },
  # D54 (2026-11-10): same class and re-check triggers as the D43 zip entries.
  { id = "RUSTSEC-2026-0429", reason = "zip 8.6 via harper-core: extract() aborts on a symlink entry with a huge declared size; harper never calls extract, D54" },
  { id = "RUSTSEC-2025-0141", reason = "bincode via harper's burn: unmaintained, compiled in, never decoded; D43" },
  { id = "RUSTSEC-2024-0436", reason = "paste via harper-core and burn: unmaintained, compile time only; D43" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5: unmaintained, merged into zbus 6, no vulnerability reported; D43" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5: unmaintained, merged into zbus 6, no vulnerability reported; D43" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5: unmaintained, merged into zbus 6, no vulnerability reported; D43" },
]

[licenses]
confidence-threshold = 0.90
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib"
]

# CC0-1.0 is a public-domain dedication. It is allowed for this one crate,
# which harper-core (the writing checker, D26) uses for SHA-3 hashing; it is
# not allowed in general.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

# Build time only: sherpa-onnx-sys's build script (voice mode's worker, D34)
# downloads and unpacks its pinned prebuilt library with ureq and zip. These
# crates run in the build and are in no Narrivy binary. All are permissive.
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[[licenses.exceptions]]
crate = "ppmd-rust"
allow = ["CC0-1.0", "MIT-0"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# Workspace crates are publish=false and MIT-licensed.
# External dependency licenses remain checked independently of the root LICENSE.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
